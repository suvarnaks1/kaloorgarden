<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Spices | Golden Aura</title>
  <meta name="description" content="Spice plants and whole spices from Kerala — black pepper, cardamom, cloves, nutmeg, cinnamon, vanilla and more.">
  <meta name="theme-color" content="#31583b">

  <link rel="icon" href="images/favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Infant:ital,wght@1,600&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./css/style.css">
</head>

<body>

  <header id="site-header"></header>

  <main>
    <section class="page-banner">
      <div>
        <h1>Spices</h1>
        <p>Spice plants and whole spices from the Kerala hills</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <p class="veg-note">
          Browse our range of spice plants and freshly dried whole spices. Use the filters to switch between spice plants and whole spices.
        </p>

        <div class="toolbar">
          <div class="chips"></div>
          <div class="tools">
            <input type="search" id="search" placeholder="Search spices…" aria-label="Search">
            <select id="sort" aria-label="Sort">
              <option value="default">Sort: Featured</option>
              <option value="az">Name: A–Z</option>
              <option value="low">Price: Low to High</option>
              <option value="high">Price: High to Low</option>
            </select>
          </div>
        </div>

        <!-- ✅ FIXED: data-cat for category filtering -->
        <div class="grid" id="product-grid" data-cat="Spices"></div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/main.js"></script>
  <script src="js/animation.js"></script>
</body>
</html>

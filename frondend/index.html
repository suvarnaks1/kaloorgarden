<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Golden Aura | Exotic &amp; Rare Plants</title>
  <meta name="description"
    content="Golden Aura — discover exotic plants, rare botanical collections and beautiful flowering plants for your home.">
  <meta name="theme-color" content="#31583b">
  <link rel="icon" href="images/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Infant:ital,wght@1,600&family=Roboto:wght@400;500;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="css/leaves.css">
</head>
<body>
  <header id="site-header"></header>
  <main>
    <!-- Hero -->
    <section class="hero-photo" aria-label="Golden Aura botanical collection">
      <div class="hero-content">
        <span class="hero-tagline">NATURE • BEAUTY • LIFE</span>
        <h1>
          Bring Nature<br>
          Into Your Home
        </h1>
        <p>
          Discover beautiful flowering plants and transform your
          space into a natural paradise.
        </p>
        <a href="#featured" class="hero-btn">
          Explore Our Plants
        </a>
      </div>
    </section>
    <!-- Featured plants -->
    <section class="section featured-section" id="products">
      <div class="container">
        <h2 class="section-title">
          Our Featured Exotic Collection
        </h2>
        <div class="featured-grid" id="featured"></div>
      </div>
      <div class="blob" aria-hidden="true"></div>
    </section>
    <!-- New arrivals -->
    <section class="section arrivals-section">
      <div class="container">
        <h2 class="section-title sm">New Arrivals</h2>
        <p class="section-sub">
          Recently Added Rare Plants
        </p>
        <div class="carousel-wrap">
          <button class="car-btn prev" type="button" aria-label="Previous plants">‹</button>
          <div class="carousel" id="arrivals"></div>
          <button class="car-btn next" type="button" aria-label="Next plants">›</button>
        </div>
        <div class="center-btn">
          <a class="btn-outline" href="shop.html">View More</a>
        </div>
      </div>
    </section>
  </main>
  <footer id="site-footer"></footer>
  <script src="js/main.js"></script>
  <script src="js/animation.js"></script>
</body>
</html>

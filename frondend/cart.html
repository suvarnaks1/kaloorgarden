<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Cart | Golden Aura</title>
<link rel="icon" href="images/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Infant:ital,wght@1,600&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/leaves.css">
</head>
<body>
<header id="site-header"></header>
<section class="page-banner"><div><h1>Your Cart</h1><p>Review your botanical picks</p></div></section>
<div class="container">
  <div class="cart-wrap">
    <div id="cart-list"></div>
    <aside class="summary" id="summary">
      <h3>Order Summary</h3>
      <div class="row"><span>Subtotal</span><span id="sub">$0.00</span></div>
      <div class="row"><span>Shipping</span><span id="ship">$0.00</span></div>
      <div class="row total"><span>Total</span><span id="total">$0.00</span></div>
      <p style="font-size:12px;color:#666;margin-top:8px">Free shipping on orders over $50.</p>
      <button class="btn btn-fill" id="checkout">Checkout</button>
      <a class="btn btn-line" href="shop.html" style="display:block;margin-top:10px;padding:10px">Continue Shopping</a>
    </aside>
  </div>
</div>
<footer id="site-footer"></footer>
<script src="js/main.js"></script>
<script src="js/animation.js"></script>
</body>
</html>

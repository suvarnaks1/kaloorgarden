<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact | Golden Aura</title>
<link rel="icon" href="images/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Infant:ital,wght@1,600&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/leaves.css">
</head>
<body>
<header id="site-header"></header>
<section class="page-banner"><div><h1>Get in Touch</h1><p>Questions about a plant? We'd love to help.</p></div></section>
<div class="container">
  <div class="contact">
    <div class="contact-info">
      <h3>Visit or Contact Us</h3>
      <p>📍 12 Greenhouse Lane, Botanic District</p>
      <p>📞 +1 (555) 012-3456</p>
      <p>✉️ hello@goldenaura.example</p>
      <p>🕘 Mon–Sat, 9:00 am – 6:00 pm</p>
    </div>
    <form class="cform" id="contact-form" novalidate>
      <div><label for="name">Name</label><input id="name" type="text" placeholder="Your name"><div class="err"></div></div>
      <div><label for="email">Email</label><input id="email" type="email" placeholder="you@example.com"><div class="err"></div></div>
      <div><label for="topic">Topic</label>
        <select id="topic"><option>General question</option><option>Order help</option><option>Plant care advice</option><option>Wholesale</option></select></div>
      <div><label for="message">Message</label><textarea id="message" rows="5" placeholder="How can we help?"></textarea><div class="err"></div></div>
      <button class="btn btn-fill" type="submit">Send Message</button>
    </form>
  </div>
</div>
<footer id="site-footer"></footer>
<script src="js/main.js"></script>
<script src="js/animation.js"></script>
</body>
</html>
